<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>스마트팜 시뮬레이터</title>
    <style>
        /* 전체 화면 스타일 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            /* 가로 중앙 정렬 */
            align-items: center;
            /* 세로 중앙 정렬 */
            height: 100vh;
            /* 화면 전체 높이 */
            background-color: black;
            /* 배경 색상 설정 */
            overflow: hidden;
            /* 스크롤 제거 */
        }

        canvas {
            display: block;
            /* 캔버스가 블록 요소로 렌더링 */
            margin: auto;
            /* 중앙 정렬 */
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/phaser@v3.90.0/dist/phaser.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
